[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openbedside"
version = "0.2.0"
description = "Open, vendor-neutral gateway between bedside devices (infusion pumps, ventilators) and the EHR. Not a medical device."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []          # standard library only, on purpose
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Daniel C. Pettus" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
openbedside = "openbedside.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openbedside = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
