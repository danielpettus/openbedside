# Render Blueprint for the OpenBedside cloud demo (simulated pump, synthetic data only).
# In Render: New > Blueprint > pick this repository. It asks you for DEMO_KEY: use letters
# and digits only (it goes in a web address). Free plan sleeps after 15 idle minutes and
# takes about a minute to wake.
services:
  - type: web
    runtime: docker
    name: openbedside-demo
    plan: free
    dockerfilePath: ./deploy/cloud/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: DEMO_KEY
        sync: false
      - key: SCENARIO
        value: "sodium chloride 0.9% 1,000 mL|125|1000|12724066"
